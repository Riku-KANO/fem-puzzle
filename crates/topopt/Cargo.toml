[package]
name = "topopt"
description = "Offline SIMP/OC topology optimiser: computes stage benchmark solutions and targets"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fem.workspace = true
stage.workspace = true
# float_roundtrip: exact float parsing, so untouched stage fields re-serialise byte-identically.
serde_json = { workspace = true, features = ["float_roundtrip"] }
