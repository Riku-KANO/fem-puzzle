[workspace]
resolver = "3"
members = ["crates/stage", "crates/fem", "crates/fem-wasm", "crates/topopt", "crates/fem-bench"]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
stage = { path = "crates/stage" }
fem = { path = "crates/fem" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23"
wasm-bindgen = "0.2"
js-sys = "0.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

# Fast-ish tests for numeric code: optimise dependencies and our crates a bit even in dev.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

# Used by `scripts/bench.sh` and the perf gate.
[profile.bench]
inherits = "release"
debug = false
